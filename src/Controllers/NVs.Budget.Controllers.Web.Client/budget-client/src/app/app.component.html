<tui-root [attr.tuiTheme]="(isDarkTheme$ | async) ? 'dark' : null">
    <header tuiNavigationHeader class="flex-space-between">
            <span class="flex">
                <span tuiNavigationLogo> <a routerLink="/" tuiLink>The Budget.</a></span>
                @if (appVersion$ | async; as appVersion) {
                    <span class="app-version">v{{ appVersion }}</span>
                }
                @if (isAuthenticated$ | async) {
                    <app-budget-selector />
                }
            </span>
            <span class="flex">
                @if (navLinks$ | async; as navLinks) {
                    <nav class="budget-navigation">
                        @for (link of navLinks; track link.label) {
                            <a
                                tuiLink
                                [routerLink]="link.commands"
                                [attr.data-testid]="'nav-link-' + link.label"
                                routerLinkActive="active-nav-link"
                                [routerLinkActiveOptions]="{ exact: link.label !== 'operations' }"
                            >
                                {{ link.label }}
                            </a>
                        }
                    </nav>
                }
                <button 
                    tuiIconButton
                    appearance="icon"
                    size="s"
                    (click)="toggleTheme()"
                    [attr.aria-label]="(isDarkTheme$ | async) ? 'Switch to light theme' : 'Switch to dark theme'"
                >
                    <tui-icon [icon]="(isDarkTheme$ | async) ? '@tui.sun' : '@tui.moon'" />
                </button>
                @if (isAuthenticated$ | async) {
                    <span>
                        <span data-testid="owner-name">{{ownerName$ | async}}</span>
                    </span>
                }
                <app-auth></app-auth>
            </span>
    </header>
    <main tuiNavigationMain>
        <router-outlet />
    </main>
</tui-root>
