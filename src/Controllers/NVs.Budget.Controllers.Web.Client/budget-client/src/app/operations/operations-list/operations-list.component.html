<div class="operations-container">
  <div class="operations-card">
    <div class="header">
      <h2 tuiTitle size="l" data-testid="operations-page-title">Operations</h2>
      <div class="header-actions">
        <button
          tuiButton
          type="button"
          appearance="secondary"
          size="m"
          (click)="navigateToImport()">
          Import CSV
        </button>
        <button
          tuiButton
          type="button"
          appearance="primary"
          size="m"
          (click)="navigateToManualImport()">
          Add Manually
        </button>
        <button
          tuiButton
          type="button"
          appearance="secondary"
          size="m"
          (click)="navigateToRetag()">
          Retag
        </button>
        <button
          tuiButton
          type="button"
          appearance="secondary"
          size="m"
          (click)="navigateToBulkChanges()">
          Bulk Changes
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters-section">
      <app-criteria-filter
        [initialCriteria]="currentCriteria()"
        [showExamplesInitially]="false"
        (criteriaSubmitted)="onCriteriaSubmitted($event)"
        (criteriaCleared)="onCriteriaCleared()">

            <tui-textfield tuiChevron class="currency-selector">
              <input
                tuiSelect
                placeholder="Output Currency"
                tuiTextfieldSize="s"
                [(ngModel)]="outputCurrency"
              />
              <tui-data-list-wrapper
                *tuiDropdown
                new
                [items]="items"
              />
            </tui-textfield>

            <label tuiLabel size="m">
              <input
                tuiCheckbox
                type="checkbox"
                [(ngModel)]="excludeTransfers"
              />
              Exclude Transfers
            </label>
      </app-criteria-filter>
    </div>

    <!-- Operations List -->
    <div class="operations-section">
      @if (operations(); as ops) {
        @if (ops.length > 0) {
          <app-operations-table
            [operations]="ops"
            [showActions]="true"
            (operationsDeleted)="onDeleteOperations($event)"
            (operationsUpdated)="onUpdateOperations($event)"
            (operationNoteUpdated)="onUpdateOperationNote($event)">
          </app-operations-table>

          <div class="operations-count">
            Total: {{ operations().length }} operations
          </div>
        } @else {
          <div class="empty-state">
            <p>No operations found.</p>
            <div class="header-actions">
              <button
                tuiButton
                type="button"
                appearance="secondary"
                size="m"
                (click)="navigateToImport()">
                Import CSV
              </button>
              <button
                tuiButton
                type="button"
                appearance="primary"
                size="m"
                (click)="navigateToManualImport()">
                Add Manually
              </button>
              <button
                tuiButton
                type="button"
                appearance="secondary"
                size="m"
                (click)="navigateToRetag()">
                Retag
              </button>
            </div>
          </div>
        }
      } @else {
        <tui-loader [loading]="true">
          <div class="loading-placeholder">Loading operations...</div>
        </tui-loader>
      }

      @if (isMutating()) {
        <div class="processing-overlay" aria-live="polite" aria-busy="true">
          <div class="processing-overlay-content">
            <tui-loader [loading]="true" [inheritColor]="true"></tui-loader>
            <span>Processing changes...</span>
          </div>
        </div>
      }
    </div>
  </div>
</div>
