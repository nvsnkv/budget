<button tuiButton
    tuiChevron
    tuiDropdownOpen
    type="button" 
    data-testid="budget-selector-trigger"
    [tuiDropdown]="content"> 
        {{(selectedBudget$ | async)?.name ?? "Select budget from list..."}} 
</button>

<ng-template #content>
    <tui-data-list role="menu" [emptyContent]="">
        <tui-opt-group>
            <a tuiOption *ngFor="let budget of budgetsSnapshot" [routerLink]="['/budget', budget.id, 'operations']" role="menuitem" [attr.data-testid]="'budget-option-' + budget.id">
                {{budget.name}}
            </a>
        </tui-opt-group>
        <tui-opt-group>
            <a tuiOption [routerLink]="['/budget/new']" role="menuitem" data-testid="budget-option-new">
                Add new budget
            </a>
        </tui-opt-group>
    </tui-data-list>
</ng-template>
