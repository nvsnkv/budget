<form
    class="new-budget-form"
    tuiAppearance="floating"
    tuiForm="m"
    data-testid="new-budget-form"
    [formGroup]="nameGroup"
    (ngSubmit)="onSubmit()"
>
    @if (errorMessage(); as error) {
        <div tuiNotification
            appearance="negative"
            class="tui-space_bottom-4"
            (closed)="errorMessage.set('')"
        >
            {{ error }}
        </div>
    }
    <h2 tuiTitle size="l" class="tui-space_bottom-4">
        Create New Budget
    </h2>
    <tui-textfield>
        <label tuiLabel>Name</label>
        <input
            formControlName="name"
            placeholder="My new budget"
            data-testid="new-budget-name-input"
            tuiInput
        />
    </tui-textfield>
    <tui-error
        formControlName="name"
        
    />
    <label class="tui-space_top-2 tui-space_bottom-2">
        <input
            tuiCheckbox
            type="checkbox"
            formControlName="generateDemoBudget"
            data-testid="new-budget-demo-checkbox"
        />
        Generate demo budget (rules and operations)
    </label>
    <button
        tuiButton
        type="submit"
        data-testid="new-budget-submit"
        [disabled]="nameGroup.invalid"
    >
        Create
    </button>
</form>
